<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crear Nuevo Producto - BackService</title>
  <!-- Bootstrap CSS para estilos rápidos -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

  <div class="container mt-5 mb-5" style="max-width: 650px;">
    <div class="card shadow">
      <div class="card-header bg-primary text-white">
        <h4 class="mb-0">Registrar Nuevo Producto</h4>
      </div>
      <div class="card-body">

        <!-- Alerta de respuesta del servidor -->
        <div id="alertaRespuesta" class="alert d-none" role="alert"></div>

        <!-- Formulario -->
        <form id="formProducto">
          
          <div class="mb-3">
            <label for="nombre" class="form-label">Nombre del Producto</label>
            <input type="text" class="form-control" id="nombre" required placeholder="Ej. Mouse Gamer RGB">
          </div>

          <div class="mb-3">
            <label for="descripcion" class="form-label">Descripción</label>
            <textarea class="form-control" id="descripcion" rows="3" required placeholder="Detalles del producto..."></textarea>
          </div>

          <div class="row">
            <div class="col-md-6 mb-3">
              <label for="precio" class="form-label">Precio Regular ($)</label>
              <input type="number" step="0.01" class="form-control" id="precio" required placeholder="0.00">
            </div>

            <div class="col-md-6 mb-3">
              <label for="categoriaId" class="form-label">Categoría</label>
              <select class="form-select" id="categoriaSelect" required>
                <option value="1|Electrónica">Electrónica</option>
                <option value="2|Ropa">Ropa</option>
                <option value="3|Hogar">Hogar</option>
              </select>
            </div>
          </div>

          <!-- Opción de Oferta -->
          <div class="form-check form-switch mb-3">
            <input class="form-check-input" type="checkbox" id="enOferta">
            <label class="form-check-label" for="enOferta">¿Está en Oferta?</label>
          </div>

          <div class="mb-3 d-none" id="contenedorPrecioOferta">
            <label for="precioOferta" class="form-label">Precio de Oferta ($)</label>
            <input type="number" step="0.01" class="form-control" id="precioOferta" placeholder="0.00">
          </div>

          <div class="mb-3">
            <label for="imagen" class="form-label">URL de la Imagen</label>
            <input type="url" class="form-control" id="imagen" required value="https://placehold.co/300x200?text=Nuevo+Producto">
          </div>

          <div class="d-grid gap-2">
            <button type="submit" ="btn btn-success btn-lg" id="btnGuardar">
              Guardar Producto
            </button>
          </div>

        </form>

      </div>
    </div>
  </div>

 <!-- JavaScript -->
  <script>
    // URL de tu API desplegada
    const API_URL = "https://backservicetest-g8emcvdff0fqe2b8.canadacentral-01.azurewebsites.net/api/producto";

    // Elementos del DOM
    const formProducto = document.getElementById("formProducto");
    const checkOferta = document.getElementById("enOferta");
    const contenedorPrecioOferta = document.getElementById("contenedorPrecioOferta");
    const alertaRespuesta = document.getElementById("alertaRespuesta");
    const btnGuardar = document.getElementById("btnGuardar");

    // Evento para mostrar/ocultar el campo de precio oferta
    checkOferta.addEventListener("change", () => {
      if (checkOferta.checked) {
        contenedorPrecioOferta.classList.remove("d-none");
      } else {
        contenedorPrecioOferta.classList.add("d-none");
        document.getElementById("precioOferta").value = "";
      }
    });

    // Evento para enviar el formulario (POST)
    formProducto.addEventListener("submit", async (e) => {
      e.preventDefault(); // Evita que la página se recargue

      // Opciones de categoría
      const [catId, catNombre] = document.getElementById("categoriaSelect").value.split("|");

      // Construcción del objeto JSON
      const nuevoProducto = {
        id: 0, // El backend asignará el ID correcto automáticamente
        nombre: document.getElementById("nombre").value.trim(),
        descripcion: document.getElementById("descripcion").value.trim(),
        precio: parseFloat(document.getElementById("precio").value),
        enOferta: checkOferta.checked,
        precioOferta: checkOferta.checked ? parseFloat(document.getElementById("precioOferta").value) : null,
        imagen: document.getElementById("imagen").value.trim(),
        categoriaId: parseInt(catId),
        categoriaNombre: catNombre
      };

      // Deshabilitar botón durante el proceso
      btnGuardar.disabled = true;
      btnGuardar.textContent = "Guardando...";

      try {
        // Petición HTTP POST mediante Fetch API
        const response = await fetch(API_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(nuevoProducto)
        });

        if (response.ok) {
          const resultado = await response.json();
          mostrarAlerta(`¡Producto "${resultado.nombre}" creado con éxito con ID: ${resultado.id}!`, "success");
          formProducto.reset(); // Limpia los campos
          contenedorPrecioOferta.classList.add("d-none");
        } else {
          mostrarAlerta("Ocurrió un error al intentar guardar el producto.", "danger");
        }
      } catch (error) {
        console.error("Error al conectar con la API:", error);
        mostrarAlerta("No se pudo conectar con el servidor.", "danger");
      } finally {
        btnGuardar.disabled = false;
        btnGuardar.textContent = "Guardar Producto";
      }
    });

    // Función auxiliar para mostrar notificaciones
    function mostrarAlerta(mensaje, tipo) {
      alertaRespuesta.className = `alert alert-${tipo}`;
      alertaRespuesta.textContent = mensaje;
      alertaRespuesta.classList.remove("d-none");

      // Ocultar alerta automáticamente después de 4 segundos
      setTimeout(() => {
        alertaRespuesta.classList.add("d-none");
      }, 4000);
    }
  </script>

</body>

</html>
